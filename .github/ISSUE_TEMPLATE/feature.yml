name: Feature idea
description: Suggest something new for the map or the viewer.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like, and why would it make the map better?
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it could work
      description: Optional. Data it needs, where it would show, anything you have tried.
