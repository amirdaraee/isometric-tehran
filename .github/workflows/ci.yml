name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (GitHub Pages base path)
        run: npm run build:pages

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -r pyproject.toml --extra dev
      - name: Lint (ruff)
        run: .venv/bin/ruff check .
      - name: Unit tests (pytest, small fixtures, no downloads)
        run: .venv/bin/python -m pytest -q

  repo-checks:
    name: repo-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: No big files, raw data or secrets
        run: python3 scripts/check_repo.py
      # A pull request that adds a painted-block submission may change nothing but submission JSON files.
      # Runs on pull_request (read-only token, no secrets); never pull_request_target.
      - name: Submission pull requests change only pipeline/paint/submissions/*.json
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_submission_pr.py "origin/${{ github.base_ref }}"
