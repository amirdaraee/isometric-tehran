[project]
name = "isometric-tehran-pipeline"
version = "0.1.0"
description = "Data, render and tile pipeline for Isometric Tehran"
requires-python = ">=3.11"
license = { text = "MIT" }
# Core: what the render and the tile build need.
dependencies = [
  "rasterio",
  "pyarrow",
  "numpy",
  "pillow",
  "pyproj",
  "shapely",
  "scipy",
  "opencv-python-headless",
  "moderngl",
  "pyvips[binary]",
]

[project.optional-dependencies]
# Downloads (fetch_data.py): Overture buildings and the Copernicus DEM window.
fetch = ["overturemaps"]
# Checks run in CI on small fixtures (no downloads, no GPU).
dev = ["pytest", "ruff"]
# The painter on a CUDA GPU (docs/PAINTING.md). Not needed for planning, the dry run, review or CI. The versions
# are the ones Isometric Luxembourg painted with (diffusers from git: Qwen-Image-Edit-2511 support).
paint = [
  "torch>=2.8",
  "diffusers @ git+https://github.com/huggingface/diffusers.git@c943837899b16cbae2f619b8dd4f7bb6f07dd81a",
  "transformers==5.5.3",
  "peft==0.18.1",
  "accelerate",
  "safetensors",
  "huggingface_hub",
  "hf_xet",
]
# 4-bit transformer for 24 GB cards (paint/painter.py --memory nf4).
paint-nf4 = ["bitsandbytes>=0.45"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Command-line scripts in paint/ fix sys.path before their imports, so they also run as `python paint/x.py`.
"paint/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
